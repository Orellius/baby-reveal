<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בן או בת?</title>
<meta name="description" content="גרדו את הכרטיס וגלו">
<meta property="og:title" content="בן או בת?">
<meta property="og:description" content="גרדו את הכרטיס וגלו">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf7f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Gveret+Levin&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7f2;
    --ink: #2b2530;
    --muted: #6f6675;
    --ticket: #fffdf9;
    --ticket-line: #e6dccf;
    --card-size: min(72vw, 48svh, 340px);
    --round: "Fredoka", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    --script: "Gveret Levin", "Fredoka", -apple-system, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px;
    min-height: 100svh;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: background-color 1.2s ease;
  }
  header { text-align: center; }
  h1 { margin: 0 0 6px; font-family: var(--round); font-size: clamp(34px, 10vw, 52px); font-weight: 700; }
  .sub { margin: 0; font-family: var(--round); font-weight: 500; font-size: clamp(16px, 4.5vw, 19px); color: var(--muted); }
  @media (max-height: 640px) {
    body { gap: 16px; padding-block: 12px; }
    h1 { font-size: 30px; }
  }

  /* The printed ticket around the scratch panel. */
  .ticket {
    padding: 14px;
    border-radius: 24px;
    background:
      radial-gradient(rgba(43, 37, 48, 0.05) 1px, transparent 1.2px) 0 0 / 7px 7px,
      var(--ticket);
    border: 1px solid var(--ticket-line);
    box-shadow: 0 18px 50px rgba(43, 37, 48, 0.16), 0 2px 6px rgba(43, 37, 48, 0.08);
  }
  .card {
    position: relative;
    width: var(--card-size);
    height: var(--card-size);
    border-radius: 14px;
    overflow: hidden;
    background: #ddd;
  }
  /* Under the foil: a neutral print, so scratching gives nothing away. */
  .prize {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    visibility: hidden;
    background:
      radial-gradient(rgba(120, 100, 70, 0.12) 1.2px, transparent 1.5px) 0 0 / 12px 12px,
      #efe7da;
    color: #b3a48c;
    font-family: var(--round);
  }
  .prize .emoji { display: none; font-size: calc(var(--card-size) * 0.26); line-height: 1.25; }
  .prize .word { font-size: calc(var(--card-size) * 0.42); font-weight: 700; line-height: 1.1; }
  .prize.spin { color: #fff; }
  .prize.spin .word { font-size: calc(var(--card-size) * 0.36); }
  .prize.boom { color: #fff; animation: boom 0.7s cubic-bezier(.2, 1.6, .4, 1); }
  .prize.boom .emoji { display: block; filter: drop-shadow(0 4px 12px rgba(80, 0, 30, 0.35)); }
  .prize.boom .word {
    font-family: var(--script);
    font-weight: 400;
    font-size: calc(var(--card-size) * 0.25);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
  }
  @keyframes boom {
    0% { transform: scale(0.6); filter: brightness(2.2); }
    55% { transform: scale(1.08); filter: brightness(1.2); }
    100% { transform: scale(1); filter: none; }
  }
  canvas.cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity 0.7s ease;
  }
  canvas.cover:active { cursor: grabbing; }
  canvas.cover.gone { opacity: 0; pointer-events: none; }

  /* A light glint that moves over the foil until the first touch. */
  .glint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.16) 48%, rgba(255, 255, 255, 0.05) 52%, transparent 62%);
    background-size: 250% 100%;
    animation: glint 3.2s ease-in-out infinite;
  }
  .glint.off { display: none; }
  @keyframes glint {
    0% { background-position: 130% 0; }
    60%, 100% { background-position: -30% 0; }
  }
  @media (prefers-reduced-motion: reduce) { .glint { animation: none; opacity: 0; } }

  .after {
    min-height: 32px;
    margin: 0;
    font-family: var(--round);
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
  }
  .after.show { opacity: 1; transform: none; }
  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>בן או בת?</h1>
    <p class="sub">גרדו את הכרטיס עם האצבע</p>
  </header>
  <div class="ticket">
    <div class="card" id="card">
      <div class="prize" id="prize"><div class="emoji" id="emoji"></div><div class="word" id="word">?</div></div>
      <canvas class="cover" id="cover"></canvas>
      <div class="glint" id="glint"></div>
    </div>
  </div>
  <p class="after" id="after">מזל טוב! 🎉</p>
  <canvas class="fx" id="fx"></canvas>
<script>
(() => {
  // The answer is encoded so it does not show up in a quick look at the source.
  const P = "IUMcTUxfUx1FCXcNjmItFGDw+vPEiNbBIPmPhYkHABFJY3JtJjQKAFAE";
  const raw = Uint8Array.from(atob(P), (ch, i) => ch.charCodeAt(0) ^ ((0x5a + i * 7) & 255));
  const prize = JSON.parse(new TextDecoder().decode(raw));

  const card = document.getElementById("card");
  const prizeEl = document.getElementById("prize");
  const cover = document.getElementById("cover");
  const glint = document.getElementById("glint");
  const ctx = cover.getContext("2d", { willReadFrequently: true });
  const split = new URLSearchParams(location.search).get("cover") === "split";
  const FONT = "Fredoka, -apple-system, BlinkMacSystemFont, Arial, sans-serif";
  const word = document.getElementById("word");
  const emoji = document.getElementById("emoji");
  const SIDES = {
    pink: { bg: "#e85d8f", word: "בת", page: "#fde9f1", confetti: ["#e85d8f", "#ff9ec2", "#ffffff", "#ffc9dc", "#d63f78"] },
    blue: { bg: "#3d8fd6", word: "בן", page: "#e7f2fc", confetti: ["#3d8fd6", "#8cc4f2", "#ffffff", "#c4e0f8", "#2a73b8"] },
  };
  const BRUSH = 0.075;       // brush radius as a share of the card size
  const OPEN_AT = 0.55;      // share of the card scratched before it opens
  let size = 0, dpr = 1, revealed = false, last = null, moves = 0;

  // Fixed seed, so the foil looks the same on every load.
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  function paintCover() {
    const r = card.getBoundingClientRect();
    size = r.width;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cover.width = Math.round(size * dpr);
    cover.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    seed = 11;

    // Base foil.
    if (split) {
      ctx.fillStyle = "#6f9fc8";
      ctx.fillRect(0, 0, size, size);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.closePath();
      ctx.fillStyle = "#d17fa0";
      ctx.fill();
    } else {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, "#2b2b30");
      g.addColorStop(0.45, "#1a1a1d");
      g.addColorStop(0.7, "#2e2e33");
      g.addColorStop(1, "#141416");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    }

    // Metallic grain: per-pixel brightness noise.
    const img = ctx.getImageData(0, 0, cover.width, cover.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (rnd() - 0.5) * 34;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(img, 0, 0);

    // Soft sheen bands, as on real foil.
    const sheen = ctx.createLinearGradient(0, size, size, 0);
    sheen.addColorStop(0, "rgba(255,255,255,0)");
    sheen.addColorStop(0.3, "rgba(255,255,255,0.07)");
    sheen.addColorStop(0.42, "rgba(255,255,255,0)");
    sheen.addColorStop(0.65, "rgba(255,255,255,0.05)");
    sheen.addColorStop(0.8, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, size, size);

    // Printed pattern of small question marks.
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.font = `700 ${size * 0.06}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const step = size / 7;
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        ctx.fillText("?", x * step + (y % 2 ? step / 2 : 0), y * step + step / 2);
      }
    }
    ctx.restore();

    // Engraved frame line.
    const inset = size * 0.06;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    roundRect(inset, inset, size - inset * 2, size - inset * 2, size * 0.04);
    ctx.stroke();

    // Embossed silver label: dark edge below, light edge above, silver face.
    embossed("?", `800 ${size * 0.34}px ${FONT}`, size * 0.45);
    embossed("גרדו כאן", `800 ${size * 0.085}px ${FONT}`, size * 0.76);

    // Show the panel under the foil only after the foil is painted.
    prizeEl.style.visibility = "visible";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function embossed(text, font, y) {
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const off = Math.max(1, size * 0.004);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillText(text, size / 2, y + off);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillText(text, size / 2, y - off);
    const silver = ctx.createLinearGradient(0, y - size * 0.15, 0, y + size * 0.15);
    silver.addColorStop(0, "#f2f2f4");
    silver.addColorStop(0.45, "#a9a9b0");
    silver.addColorStop(0.55, "#d9d9de");
    silver.addColorStop(1, "#8d8d94");
    ctx.fillStyle = silver;
    ctx.fillText(text, size / 2, y);
  }

  function point(e) {
    const r = cover.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, cx: e.clientX, cy: e.clientY };
  }

  // A coin edge is not a clean circle: erase a core plus jittered chips around it.
  function chip(x, y, rad) {
    ctx.beginPath();
    ctx.arc(x, y, rad * 0.78, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = rad * (0.6 + Math.random() * 0.38);
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * dist, y + Math.sin(a) * dist, rad * (0.05 + Math.random() * 0.12), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Small foil flecks that the coin leaves behind.
  function fleck(x, y, rad) {
    const a = Math.random() * Math.PI * 2;
    const dist = rad * Math.random() * 0.85;
    ctx.fillStyle = FOIL[Math.floor(Math.random() * FOIL.length)];
    ctx.fillRect(x + Math.cos(a) * dist, y + Math.sin(a) * dist, 0.8 + Math.random() * 1.6, 0.8 + Math.random() * 1.2);
  }

  function scratch(p) {
    const rad = size * BRUSH;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    const from = last || p;
    const dist = Math.hypot(p.x - from.x, p.y - from.y);
    const steps = Math.max(1, Math.ceil(dist / 3));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      chip(from.x + (p.x - from.x) * t, from.y + (p.y - from.y) * t, rad);
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      if (Math.random() < 0.15) fleck(from.x + (p.x - from.x) * t, from.y + (p.y - from.y) * t, rad);
    }
    shavings(p, dist);
    sound(dist);
    buzz();
    last = p;
    if (++moves % 8 === 0) checkOpen();
  }

  function checkOpen() {
    const step = 8;
    const data = ctx.getImageData(0, 0, cover.width, cover.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * step) { total++; if (data[i] < 128) clear++; }
    if (clear / total >= OPEN_AT) open();
  }

  // Foil shavings that fall from the coin.
  const fx = document.getElementById("fx");
  const fg = fx.getContext("2d");
  const FOIL = split ? ["#d17fa0", "#6f9fc8", "#c9c9cf"] : ["#2a2a2e", "#4a4a50", "#8c8c93", "#c4c4ca"];
  let bits = [], fxRunning = false;

  function sizeFx() { fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }

  function shavings(p, dist) {
    const n = Math.min(6, Math.floor(dist / 4) + (Math.random() < 0.5 ? 1 : 0));
    for (let i = 0; i < n && bits.length < 400; i++) {
      bits.push({
        x: p.cx * dpr, y: p.cy * dpr,
        vx: (Math.random() - 0.5) * 3 * dpr,
        vy: (-Math.random() * 2.5) * dpr,
        s: (1.5 + Math.random() * 3) * dpr,
        a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.4,
        col: FOIL[Math.floor(Math.random() * FOIL.length)],
        life: 1,
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
  }

  function tick() {
    fg.clearRect(0, 0, fx.width, fx.height);
    bits = bits.filter(b => b.life > 0 && b.y < fx.height + 20);
    for (const b of bits) {
      b.vy += 0.35 * dpr; b.vx *= 0.98; b.x += b.vx; b.y += b.vy; b.a += b.va;
      b.life -= b.burst ? 0.004 : 0.012;
      fg.save(); fg.translate(b.x, b.y); fg.rotate(b.a);
      fg.globalAlpha = Math.max(0, Math.min(1, b.life * 1.5));
      fg.fillStyle = b.col;
      fg.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * (b.burst ? 0.5 : 0.66));
      fg.restore();
    }
    if (bits.length) requestAnimationFrame(tick); else { fxRunning = false; fg.clearRect(0, 0, fx.width, fx.height); }
  }

  // Quiet scratch sound: filtered noise, louder when the finger moves faster.
  let audio = null, gain = null;
  function startAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    const buf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource();
    src.buffer = buf; src.loop = true;
    const band = audio.createBiquadFilter();
    band.type = "bandpass"; band.frequency.value = 3200; band.Q.value = 0.7;
    gain = audio.createGain();
    gain.gain.value = 0;
    src.connect(band).connect(gain).connect(audio.destination);
    src.start();
  }
  function sound(dist) {
    if (!gain) return;
    const level = Math.min(1, dist / (size * 0.04)) * 0.12;
    gain.gain.setTargetAtTime(level, audio.currentTime, 0.02);
    gain.gain.setTargetAtTime(0, audio.currentTime + 0.06, 0.05);
  }
  function silence() { if (gain) gain.gain.setTargetAtTime(0, audio.currentTime, 0.03); }

  // Short haptic ticks while scratching (Android; iOS has no vibrate API).
  let lastBuzz = 0;
  function buzz() {
    const now = performance.now();
    if (navigator.vibrate && now - lastBuzz > 70) { navigator.vibrate(4); lastBuzz = now; }
  }

  function open() {
    if (revealed) return;
    revealed = true;
    silence();
    cover.classList.add("gone");
    setTimeout(roulette, 650);
  }

  // Pink and blue swap faster than the eye can follow, slow down, then stop on the answer.
  function roulette() {
    const win = prize.s;
    const lose = win === "pink" ? "blue" : "pink";
    const delays = [];
    for (let d = 50; d < 560; d *= 1.13) delays.push(d);
    const n = delays.length + 1;
    const first = (n - 1) % 2 === 0 ? win : lose;
    prizeEl.classList.add("spin");
    let k = 0;
    (function step() {
      const side = k % 2 === 0 ? first : (first === win ? lose : win);
      prizeEl.style.background = SIDES[side].bg;
      word.textContent = SIDES[side].word;
      click();
      if (navigator.vibrate) navigator.vibrate(6);
      if (k === n - 1) { setTimeout(() => boom(win), 520); return; }
      setTimeout(step, delays[k++]);
    })();
  }

  function boom(win) {
    prizeEl.classList.remove("spin");
    prizeEl.classList.add("boom");
    word.textContent = prize.t;
    emoji.textContent = prize.e;
    document.body.style.backgroundColor = SIDES[win].page;
    document.querySelector('meta[name="theme-color"]').content = SIDES[win].page;
    document.getElementById("after").classList.add("show");
    thump();
    if (navigator.vibrate) navigator.vibrate([80, 40, 160]);
    confetti(SIDES[win].confetti);
  }

  // Roulette click and the final thump, only if sound was started by the first touch.
  function click() {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "square"; o.frequency.value = 1900;
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.04);
  }
  function thump() {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "sine";
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.4);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.65);
  }

  function confetti(colors) {
    const cx = fx.width / 2, cy = fx.height * 0.45;
    for (let i = 0; i < 180; i++) {
      bits.push({
        x: cx + (Math.random() - 0.5) * fx.width * 0.3, y: cy,
        vx: (Math.random() - 0.5) * 22 * dpr,
        vy: (-Math.random() * 22 - 8) * dpr,
        s: (8 + Math.random() * 8) * dpr,
        a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3,
        col: colors[Math.floor(Math.random() * colors.length)],
        life: 1, burst: true,
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
  }

  cover.addEventListener("pointerdown", e => {
    if (revealed) return;
    cover.setPointerCapture(e.pointerId);
    glint.classList.add("off");
    startAudio();
    last = null;
    scratch(point(e));
  });
  cover.addEventListener("pointermove", e => {
    if (revealed || !cover.hasPointerCapture(e.pointerId)) return;
    scratch(point(e));
  });
  const end = () => { last = null; silence(); if (!revealed) checkOpen(); };
  cover.addEventListener("pointerup", end);
  cover.addEventListener("pointercancel", end);
  cover.addEventListener("contextmenu", e => e.preventDefault());

  // Paint with the round font when it arrives; after 1.5 s use the fallback font.
  const fontWait = new Promise(res => setTimeout(res, 1500));
  Promise.race([document.fonts.load(`700 40px Fredoka`), fontWait]).then(paintCover, paintCover);
  sizeFx();
  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { sizeFx(); if (!revealed && moves === 0) paintCover(); }, 150);
  });
})();
</script>
</body>
</html>
