<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בן או בת?</title>
<meta name="description" content="גרדו את הכרטיס וגלו">
<meta property="og:title" content="בן או בת?">
<meta property="og:description" content="גרדו את הכרטיס וגלו">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf7f2">
<style>
  :root {
    --bg: #fbf7f2;
    --ink: #2b2530;
    --muted: #6f6675;
    --card-size: min(78vw, 360px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px;
    min-height: 100svh;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  header { text-align: center; }
  h1 { margin: 0 0 8px; font-size: clamp(34px, 9vw, 48px); font-weight: 800; letter-spacing: -0.5px; }
  .sub { margin: 0; font-size: 18px; color: var(--muted); }
  .card {
    position: relative;
    width: var(--card-size);
    height: var(--card-size);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(43, 37, 48, 0.18), 0 2px 6px rgba(43, 37, 48, 0.08);
    background: #ddd;
  }
  .prize {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    visibility: hidden;
  }
  .prize .emoji { font-size: calc(var(--card-size) * 0.3); line-height: 1.15; }
  .prize .text { font-size: calc(var(--card-size) * 0.16); font-weight: 800; }
  canvas.cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity 0.7s ease;
  }
  canvas.cover.gone { opacity: 0; pointer-events: none; }
  .after {
    min-height: 32px;
    font-size: 22px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
  }
  .after.show { opacity: 1; transform: none; }
  canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>בן או בת?</h1>
    <p class="sub">גרדו את הכרטיס עם האצבע</p>
  </header>
  <div class="card" id="card">
    <div class="prize" id="prize"><div class="emoji"></div><div class="text"></div></div>
    <canvas class="cover" id="cover"></canvas>
  </div>
  <p class="after" id="after">מזל טוב! 🎉</p>
  <canvas class="confetti" id="confetti"></canvas>
<script>
(() => {
  // The answer is encoded so it does not show up in a quick look at the source.
  const P = "IUMcTUxfUx1FCXcNjmItFGDw+vPEiNbBIPmPhYkHABFZY3JtdTldWBNOuKWit/iBkJOb2aCo576Ey9zVlSc2SDgCTkkAWyVzcHVCRAgTHrDp97qzhI7S3aSvtrH8yc7QnGc7ay5/BgcQGiYhKmQ5UEgsBQ==";
  const raw = Uint8Array.from(atob(P), (ch, i) => ch.charCodeAt(0) ^ ((0x5a + i * 7) & 255));
  const prize = JSON.parse(new TextDecoder().decode(raw));

  const card = document.getElementById("card");
  const prizeEl = document.getElementById("prize");
  const cover = document.getElementById("cover");
  const ctx = cover.getContext("2d");
  const black = new URLSearchParams(location.search).get("cover") === "black";
  const BRUSH = 0.09;        // brush radius as a share of the card size
  const OPEN_AT = 0.55;      // share of the card scratched before it opens
  let size = 0, dpr = 1, revealed = false, last = null, strokes = 0;

  function paintCover() {
    const r = card.getBoundingClientRect();
    size = r.width;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cover.width = Math.round(size * dpr);
    cover.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";

    if (black) {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, "#26232a");
      g.addColorStop(0.5, "#3a3640");
      g.addColorStop(1, "#1c1a1f");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    } else {
      // Half pink, half blue, split on the diagonal.
      ctx.fillStyle = "#8ec5f2";
      ctx.fillRect(0, 0, size, size);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.closePath();
      ctx.fillStyle = "#f6a3c3";
      ctx.fill();
    }

    // Fine speckle so the surface reads as a scratch card.
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 900; i++) {
      ctx.fillStyle = `rgba(255,255,255,${0.05 + rnd() * 0.12})`;
      ctx.fillRect(rnd() * size, rnd() * size, 1.5, 1.5);
    }

    ctx.fillStyle = "rgba(255,255,255,0.97)";
    ctx.shadowColor = "rgba(43,37,48,0.28)";
    ctx.shadowBlur = size * 0.03;
    ctx.shadowOffsetY = size * 0.008;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `800 ${size * 0.36}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;
    ctx.fillText("?", size / 2, size * 0.44);
    ctx.font = `700 ${size * 0.075}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;
    ctx.fillText("גרדו כאן", size / 2, size * 0.78);
    ctx.shadowColor = "transparent";

    // Show the prize only after the cover is painted, so it never flashes.
    prizeEl.style.background = prize.d;
    prizeEl.style.color = prize.c;
    prizeEl.querySelector(".emoji").textContent = prize.e;
    prizeEl.querySelector(".text").textContent = prize.t;
    prizeEl.style.visibility = "visible";
  }

  function point(e) {
    const r = cover.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function scratch(p) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = size * BRUSH * 2;
    ctx.beginPath();
    if (last) ctx.moveTo(last.x, last.y); else ctx.moveTo(p.x - 0.01, p.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    if (++strokes % 6 === 0) checkOpen();
  }

  function checkOpen() {
    const step = 8;
    const data = ctx.getImageData(0, 0, cover.width, cover.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * step) { total++; if (data[i] < 128) clear++; }
    if (clear / total >= OPEN_AT) open();
  }

  function open() {
    if (revealed) return;
    revealed = true;
    cover.classList.add("gone");
    document.getElementById("after").classList.add("show");
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
    confetti(prize.k);
  }

  cover.addEventListener("pointerdown", e => {
    if (revealed) return;
    cover.setPointerCapture(e.pointerId);
    last = null;
    scratch(point(e));
  });
  cover.addEventListener("pointermove", e => {
    if (revealed || !cover.hasPointerCapture(e.pointerId)) return;
    scratch(point(e));
  });
  const end = () => { last = null; if (!revealed) checkOpen(); };
  cover.addEventListener("pointerup", end);
  cover.addEventListener("pointercancel", end);

  function confetti(colors) {
    const c = document.getElementById("confetti");
    const g = c.getContext("2d");
    const w = c.width = innerWidth * dpr, h = c.height = innerHeight * dpr;
    const bits = Array.from({ length: 180 }, () => ({
      x: w / 2 + (Math.random() - 0.5) * w * 0.3,
      y: h * 0.45,
      vx: (Math.random() - 0.5) * 22 * dpr,
      vy: (-Math.random() * 22 - 8) * dpr,
      s: (6 + Math.random() * 8) * dpr,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.3,
      col: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now();
    (function frame(t) {
      g.clearRect(0, 0, w, h);
      let alive = false;
      for (const b of bits) {
        b.vy += 0.6 * dpr; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.a += b.va;
        if (b.y < h + 40) alive = true;
        g.save(); g.translate(b.x, b.y); g.rotate(b.a);
        g.fillStyle = b.col; g.strokeStyle = "rgba(43,37,48,0.12)";
        g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        g.strokeRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        g.restore();
      }
      if (alive && t - t0 < 6000) requestAnimationFrame(frame); else g.clearRect(0, 0, w, h);
    })(t0);
  }

  paintCover();
  let resizeTimer;
  addEventListener("resize", () => {
    if (revealed) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintCover, 150);
  });
})();
</script>
</body>
</html>
